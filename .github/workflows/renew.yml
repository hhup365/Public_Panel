name: Panel Auto Login & Renew
on:
  schedule:
    - cron: '51 23 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout public repo
        uses: actions/checkout@v4

      - name: 📥 Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: hhup365/Test-Panel-free-cloud
          token: ${{ secrets.GH_PAT }}
          path: private_repo

      - name: 🔄 Merge private code into workspace
        run: |
          rsync -a --exclude='.git' private_repo/ ./
          rm -rf private_repo

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser python3-tk python3-dev
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: ⚙️ Setup Proxy
        run: |
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.13.11/sing-box-1.13.11-linux-amd64.tar.gz
          tar -xzf sing-box-1.13.11-linux-amd64.tar.gz
          mv sing-box-1.13.11-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box

      - name: 🚀 Run Script
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        run: python3 app.py

      - name: 💾 Commit State File
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "📝 Auto-update state.json [skip ci]" && git push)

      - name: 📸 Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshots/
          retention-days: 5
          
